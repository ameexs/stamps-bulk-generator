<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'">
    <title>Activate — STAMPS Bulk Generator</title>
    <link rel="stylesheet" href="fonts.css">
    <style>
        :root {
            --ink: #0a0c11;
            --surface: #10131a;
            --line: rgba(233, 235, 241, 0.08);
            --line-strong: rgba(233, 235, 241, 0.16);
            --text: #e9ebf1;
            --text-2: #a3abbd;
            --text-3: #6e7787;
            --accent: #8b96f8;
            --accent-soft: rgba(139, 150, 248, 0.12);
            --gold: #d8b36a;
            --red: #ef6a6a;
            --amber: #f0b45c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background:
                radial-gradient(circle at 24% 18%, rgba(139, 150, 248, 0.07), transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(216, 179, 106, 0.05), transparent 55%),
                var(--ink);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--accent); color: var(--ink); }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--line-strong);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 26px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--ink);
            border: 1px solid var(--line-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .logo svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }

        .brand-name {
            font-size: 13px;
            color: var(--text-2);
        }

        .brand-name strong {
            color: var(--text);
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .brand-tag {
            display: block;
            margin-top: 2px;
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-3);
        }

        h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 500;
            font-size: 26px;
            letter-spacing: -0.01em;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        h1 em {
            font-style: italic;
            color: var(--accent);
        }

        p.sub {
            color: var(--text-2);
            font-size: 13.5px;
            margin-bottom: 26px;
            line-height: 1.6;
        }

        label {
            display: block;
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            font-size: 9.5px;
            color: var(--gold);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
        }

        textarea {
            width: 100%;
            min-height: 92px;
            background: var(--ink);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text);
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            font-size: 12px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        textarea::placeholder { color: var(--text-3); }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--text);
            color: var(--ink);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover:not(:disabled) {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(233, 235, 241, 0.12);
        }

        button:disabled { opacity: 0.5; cursor: default; }

        .msg {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            line-height: 1.55;
        }

        .msg.error {
            display: block;
            background: rgba(239, 106, 106, 0.09);
            color: var(--red);
            border: 1px solid rgba(239, 106, 106, 0.3);
        }

        .msg.info {
            display: block;
            background: rgba(240, 180, 92, 0.08);
            color: var(--amber);
            border: 1px solid rgba(240, 180, 92, 0.3);
        }

        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            font-size: 12.5px;
            color: var(--text-3);
            line-height: 1.75;
        }

        .footer a { color: var(--accent); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand-row">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                </svg>
            </div>
            <div class="brand-name">
                <strong>STAMPS</strong> Bulk Generator
                <span class="brand-tag">LHDN e-Duti Setem · MyTax XML</span>
            </div>
        </div>

        <h1>Activate your <em>license</em>.</h1>
        <p class="sub">Paste the license key you received to unlock the app.</p>

        <div id="status" class="msg"></div>

        <label for="key">License key</label>
        <textarea id="key" placeholder="Paste your license key here" autofocus></textarea>
        <button id="activateBtn">Activate</button>
        <div id="error" class="msg"></div>

        <div class="footer">
            Need a key or a renewal?<br>
            Email <a href="mailto:ameershafiq010@gmail.com">ameershafiq010@gmail.com</a>
            or WhatsApp <a href="https://wa.me/601123240319">+60&nbsp;11-2324&nbsp;0319</a>.
        </div>
    </div>

    <script>
        const keyEl = document.getElementById('key');
        const btn = document.getElementById('activateBtn');
        const errEl = document.getElementById('error');
        const statusEl = document.getElementById('status');

        function showError(m) { errEl.className = 'msg error'; errEl.textContent = m; }
        function clearError() { errEl.className = 'msg'; errEl.textContent = ''; }

        // If a previous key expired, explain that on load.
        (async () => {
            try {
                if (window.electronAPI && window.electronAPI.getLicenseStatus) {
                    const s = await window.electronAPI.getLicenseStatus();
                    if (s && s.hadKey && s.reason === 'License expired') {
                        statusEl.className = 'msg info';
                        const d = s.exp ? new Date(s.exp).toLocaleDateString() : '';
                        statusEl.textContent = 'Your license expired' + (d ? (' on ' + d) : '') + '. Enter a renewal key to continue.';
                    } else if (s && s.reason === 'System clock error') {
                        statusEl.className = 'msg info';
                        statusEl.textContent = 'Your system clock appears to have been changed. Please set the correct date & time, then restart the app.';
                    }
                }
            } catch (e) { /* ignore */ }
        })();

        async function activate() {
            clearError();
            const key = keyEl.value.trim();
            if (!key) { showError('Please paste your license key.'); return; }
            btn.disabled = true;
            btn.textContent = 'Activating...';
            try {
                const res = await window.electronAPI.activateLicense(key);
                if (res && res.valid) {
                    btn.textContent = 'Activated!';
                    // Main process loads the app on success.
                } else {
                    showError((res && res.reason) ? res.reason : 'Activation failed.');
                    btn.disabled = false;
                    btn.textContent = 'Activate';
                }
            } catch (e) {
                showError('Activation error. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Activate';
            }
        }

        btn.addEventListener('click', activate);
        keyEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) activate(); });
    </script>
</body>

</html>
