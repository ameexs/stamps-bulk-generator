# Netlify Configuration
[build]
  publish = "."

# Redirect www to non-www
[[redirects]]
  from = "https://www.stamps-bulk-generator.netlify.app/*"
  to = "https://stamps-bulk-generator.netlify.app/:splat"
  status = 301
  force = true

# Security headers for every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

# CSS/JS: allow the CDN to cache but force the browser to revalidate,
# so edits appear immediately instead of being stuck behind a 1-year cache.
# (ETag makes revalidation a cheap 304 when nothing changed.)
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
