# Netlify Configuration
[build]
  publish = "."

# Redirect www to non-www
[[redirects]]
  from = "https://www.stamps-generator.netlify.app/*"
  to = "https://stamps-generator.netlify.app/:splat"
  status = 301
  force = true

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
